[project]
name = "azizi-telegram-bot"
version = "1.0.0"
description = "Telegram bot for mahdiazizi.com (Azizi Math Academy)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", "dev/preview/static/vendor"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
